version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: magicofit-db
    environment:
      POSTGRES_USER: medusa
      POSTGRES_PASSWORD: medusa_password
      POSTGRES_DB: magicofit
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medusa -d magicofit"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
