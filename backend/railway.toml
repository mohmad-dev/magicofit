[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "sh -c 'cd .medusa/server && npx medusa db:migrate && if [ \"${BOOTSTRAP_ADMIN:-false}\" = \"true\" ]; then npx medusa exec delete-and-recreate-admin; fi && npx medusa start'"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
